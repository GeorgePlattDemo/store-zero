name: Regenerate current proof on repair branch
on:
  push:
    branches: [repair/outdoor-end-geometry-20261016]
    paths:
      - .github/workflows/refresh-current-proof.yml
      - scripts/build-contract-examples.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild current computed evidence
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import { buildExamples } from './scripts/build-contract-examples.mjs';
          import { writeFileSync } from 'node:fs';
          const generated = buildExamples();
          for (const path of [
            'docs/project-1-digital-trail/current-proof.json',
            'docs/project-1-digital-trail/current-proof.md',
            'STORE-ZERO-MASTER.md'
          ]) {
            writeFileSync(path, generated[path]);
            console.log('regenerated:', path);
          }
          JAVASCRIPT
      - name: Commit only generated current proof and operative master tables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project-1-digital-trail/current-proof.json docs/project-1-digital-trail/current-proof.md STORE-ZERO-MASTER.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate current Project 1 digital proof from repaired Store'
            git push origin HEAD:repair/outdoor-end-geometry-20261016
          fi
